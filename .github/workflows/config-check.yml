name: Config checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Check generated configs
        run: node script/generate-configs.mjs --check
      - name: Run routing and injection tests
        run: bun test
      - name: Check whitespace and unexpected tracked changes
        run: |
          git diff --check
          git diff --exit-code
